/* ============================

/* ============================
   ULTRA-PREMIUM BACKGROUND ARCHITECTURE
   ============================ */

  overflow:hidden;
}
/* Precision Architectural Micro-Grid with Radial Vignette */

  inset:0;
  background-image:
    linear-gradient(to right, rgba(88, 216, 255, 0.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(88, 216, 255, 0.055) 1px, transparent 1px),

}
/* Interactive Cursor Spotlight Aura */
.bg-spotlight{

}
/* Sweeping Anodized Light Beams */
.bg-beam{
  position:absolute;
  border-radius:50%;

  opacity:0.55;
  mix-blend-mode:screen;
}
.beam-1{

}
.beam-2{

  background:radial-gradient(ellipse, rgba(249,115,22,0.20) 0%, rgba(255,174,66,0.08) 50%, transparent 74%);

}
.beam-3{

  animation:beamFloat 25s ease-in-out infinite alternate;
}
@keyframes beamFloat{
  0%{transform:translate3d(0,0,0) scale(1) rotate(0deg)}
  50%{transform:translate3d(40px,-30px,0) scale(1.07) rotate(3deg)}
  100%{transform:translate3d(-30px,35px,0) scale(0.95) rotate(-2deg)}
}
#pc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.cw{position:relative;z-index:2}

/* ============================

   ============================ */
